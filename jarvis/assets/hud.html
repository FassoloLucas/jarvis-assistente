<!--
  DESIGN PLAN — J.A.R.V.I.S. Core HUD
  ------------------------------------
  Subject: a local, always-on AI companion's status display — not a chat
  window, an instrument panel. The brief asked explicitly for a movie-JARVIS
  hologram, so a cyan HUD register is the correct call here, not a default —
  the deviation from AI-cliché is in restraint: no single neon pop on flat
  black. The ground is blue-black (never true #000), three *semantic* accents
  (cyan=idle/speaking, green=listening, amber=processing) carry real meaning
  tied to the assistant's actual state, corners are chamfered/bracketed like
  a viewfinder rather than rounded-lg, and every readout on screen is real
  (live clock, live state) — nothing is decorative fake telemetry.

  Color
    --bg      #05090c  ground, blue-black
    --panel   #0a1216  panel surface
    --line    #16262d  hairline / grid / border
    --ink     #d7ecee  primary text, cool off-white
    --ink-dim #5f7d84  secondary / label text
    --cyan    #45e8ff  accent — idle & speaking
    --green   #39ffa8  accent — listening
    --amber   #ffb545  accent — processing

  Type
    Display / callsign — system sans stack, heavy weight, wide tracking,
    used small (a label, not a hero headline).
    Telemetry / status / clock — system monospace stack, tabular nums —
    genuinely functional here: it's meant to look like a system readout.

  Layout
    One vertical instrument panel, chamfered frame with corner brackets:
    brand row → circular radar/iris stage (rings, ticks, orbiting nodes,
    sweep) → waveform + live clock strip → status line → footer signature.
    A faint grid + drifting particle field sits behind the panel for depth.
-->
<title>J.A.R.V.I.S. — Core HUD</title>
<style>
  :root {
    --bg: #05090c;
    --panel: #0a1216;
    --line: #16262d;
    --ink: #d7ecee;
    --ink-dim: #5f7d84;
    --cyan: #45e8ff;
    --green: #39ffa8;
    --amber: #ffb545;
    --accent: var(--cyan);
    --accent-soft: rgba(69, 232, 255, 0.18);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    overflow-x: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 28px 16px;
    font-family: -apple-system, "Segoe UI", "Inter", system-ui, sans-serif;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(69, 232, 255, 0.06), transparent 60%),
      linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 100% 42px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 42px 100%,
      var(--bg);
    background-blend-mode: normal, overlay, overlay, normal;
  }

  body[data-state="ouvindo"]     { --accent: var(--green); --accent-soft: rgba(57, 255, 168, 0.18); }
  body[data-state="processando"] { --accent: var(--amber); --accent-soft: rgba(255, 181, 69, 0.18); }
  body[data-state="falando"]     { --accent: var(--cyan);  --accent-soft: rgba(69, 232, 255, 0.18); }
  body[data-state="aguardando"]  { --accent: var(--cyan);  --accent-soft: rgba(69, 232, 255, 0.18); }

  #particles {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .frame {
    position: relative;
    z-index: 1;
    width: clamp(300px, 92vw, 480px);
    display: flex;
    flex-direction: column;
    gap: 22px;
    padding: 26px 26px 22px;
    background: linear-gradient(180deg, var(--panel), #070d10);
    border: 1px solid var(--line);
    clip-path: polygon(
      18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%,
      0 100%, 0 18px
    );
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.4),
      0 30px 80px -30px rgba(0, 0, 0, 0.9),
      inset 0 0 60px rgba(69, 232, 255, 0.03);
  }

  .bracket {
    position: absolute;
    width: 22px;
    height: 22px;
    border: 2px solid var(--accent);
    opacity: 0.7;
    transition: border-color 0.4s ease;
  }
  .bracket.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .bracket.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  /* --- header --- */
  .brand-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
  }

  .brand h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.34em;
    color: var(--ink);
  }

  .brand p {
    margin: 4px 0 0;
    font-family: "SFMono-Regular", "Cascadia Code", Consolas, monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--ink-dim);
    text-transform: uppercase;
  }

  .pill {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: "SFMono-Regular", "Cascadia Code", Consolas, monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--green);
    white-space: nowrap;
  }

  .pill .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: blink 2.4s ease-in-out infinite;
  }

  /* --- stage / radar --- */
  .stage {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage svg { width: 100%; height: auto; overflow: visible; }

  .ring-outer {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
  }

  .tick {
    stroke: var(--accent);
    stroke-width: 1;
    opacity: 0.35;
    transition: stroke 0.4s ease;
  }
  .tick.major { opacity: 0.75; stroke-width: 1.5; }

  .ring-mid {
    fill: none;
    stroke: var(--accent);
    stroke-opacity: 0.45;
    stroke-width: 1;
    stroke-dasharray: 2 6;
    transform-origin: 150px 150px;
    animation: spin 26s linear infinite;
    transition: stroke 0.4s ease;
  }

  .orbit {
    transform-origin: 150px 150px;
    animation: spin 9s linear infinite;
  }
  .orbit.reverse { animation-direction: reverse; animation-duration: 14s; }
  .orbit circle {
    fill: var(--accent);
    filter: drop-shadow(0 0 4px var(--accent));
    transition: fill 0.4s ease;
  }

  .sweep {
    transform-origin: 150px 150px;
    fill: url(#sweepGrad);
    opacity: 0;
    animation: spin 1.4s linear infinite;
    transition: opacity 0.3s ease;
  }
  body[data-state="processando"] .sweep { opacity: 0.9; }

  .core-glow { fill: url(#coreGrad); }

  .pupil {
    fill: var(--accent);
    filter: drop-shadow(0 0 14px var(--accent));
    transform-origin: 150px 150px;
    animation: breathe 3.6s ease-in-out infinite;
    transition: fill 0.4s ease;
  }
  body[data-state="ouvindo"] .pupil { animation-duration: 1.6s; }
  body[data-state="processando"] .pupil { animation-duration: 0.8s; }
  body[data-state="falando"] .pupil { animation-duration: 0.5s; }

  /* --- telemetry strip --- */
  .telemetry {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 14px 2px;
  }

  .wave {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 26px;
  }
  .wave i {
    display: block;
    width: 4px;
    height: 6px;
    border-radius: 2px;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent-soft);
    transition: height 0.12s ease, background 0.4s ease;
  }

  .clock {
    font-family: "SFMono-Regular", "Cascadia Code", Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 20px;
    letter-spacing: 0.06em;
    color: var(--ink);
  }
  .clock span {
    display: block;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--ink-dim);
    margin-top: 2px;
  }

  /* --- status line --- */
  .status {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: "SFMono-Regular", "Cascadia Code", Consolas, monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--accent);
    text-shadow: 0 0 12px var(--accent-soft);
    transition: color 0.4s ease;
    min-height: 18px;
  }
  .status .dot {
    width: 7px;
    height: 7px;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    flex: none;
    animation: blink 1.4s ease-in-out infinite;
    transition: background 0.4s ease;
  }

  footer {
    display: flex;
    justify-content: space-between;
    font-family: "SFMono-Regular", "Cascadia Code", Consolas, monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    color: var(--ink-dim);
    text-transform: uppercase;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  @media (prefers-reduced-motion: reduce) {
    .ring-mid, .orbit, .sweep, .pupil, .pill .dot, .status .dot { animation: none !important; }
  }
</style>

<div id="particles"></div>

<main class="frame" data-frame>
  <span class="bracket tl"></span>
  <span class="bracket br"></span>

  <div class="brand-row">
    <div class="brand">
      <h1>J . A . R . V . I . S .</h1>
      <p>Core HUD // Demonstração</p>
    </div>
    <div class="pill"><span class="dot"></span>ONLINE</div>
  </div>

  <div class="stage">
    <svg viewBox="0 0 300 300" role="img" aria-label="Indicador de estado do J.A.R.V.I.S.">
      <defs>
        <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.35" />
          <stop offset="70%" stop-color="var(--accent)" stop-opacity="0.05" />
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity="0" />
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0.5" />
        </linearGradient>
      </defs>

      <circle class="ring-outer" cx="150" cy="150" r="118" />
      <g id="ticks"></g>
      <circle class="ring-mid" cx="150" cy="150" r="96" />

      <path class="sweep" d="M150,150 L150,32 A118,118 0 0,1 234,84 Z" />

      <g class="orbit"><circle cx="256" cy="150" r="3.2" /></g>
      <g class="orbit reverse"><circle cx="150" cy="46" r="2.4" /></g>

      <circle class="core-glow" cx="150" cy="150" r="70" />
      <circle class="pupil" cx="150" cy="150" r="16" />
    </svg>
  </div>

  <div class="telemetry">
    <div class="wave" id="wave"></div>
    <div class="clock" id="clock">--:--:--<span>HORA LOCAL</span></div>
  </div>

  <div class="status">
    <span class="dot"></span>
    <span id="statusText">[ INICIALIZANDO PROTOCOLOS... ]</span>
  </div>

  <footer>
    <span>Sistema 100% local</span>
    <span id="versionTag">Core v2</span>
  </footer>
</main>

<script>
  const body = document.body;
  const statusText = document.getElementById("statusText");
  const ticksGroup = document.getElementById("ticks");
  const waveEl = document.getElementById("wave");
  const clockEl = document.getElementById("clock");

  const NS = "http://www.w3.org/2000/svg";
  const CENTER = 150;

  // --- radar ticks ---
  for (let i = 0; i < 60; i++) {
    const angle = (i / 60) * Math.PI * 2;
    const major = i % 5 === 0;
    const rOuter = 118;
    const rInner = major ? 108 : 112;
    const line = document.createElementNS(NS, "line");
    line.setAttribute("x1", CENTER + rInner * Math.cos(angle));
    line.setAttribute("y1", CENTER + rInner * Math.sin(angle));
    line.setAttribute("x2", CENTER + rOuter * Math.cos(angle));
    line.setAttribute("y2", CENTER + rOuter * Math.sin(angle));
    line.setAttribute("class", major ? "tick major" : "tick");
    ticksGroup.appendChild(line);
  }

  // --- waveform bars ---
  const BAR_COUNT = 11;
  const bars = [];
  for (let i = 0; i < BAR_COUNT; i++) {
    const bar = document.createElement("i");
    waveEl.appendChild(bar);
    bars.push(bar);
  }

  function idleBarHeight(i) {
    const mid = (BAR_COUNT - 1) / 2;
    return 6 + Math.max(0, 3 - Math.abs(i - mid));
  }

  function renderWave(active) {
    bars.forEach((bar, i) => {
      const h = active
        ? 6 + Math.random() * 20 * (1 - Math.abs(i - (BAR_COUNT - 1) / 2) / BAR_COUNT)
        : idleBarHeight(i);
      bar.style.height = `${h}px`;
    });
  }
  renderWave(false);
  setInterval(() => renderWave(body.dataset.state === "falando"), 90);

  // --- live clock ---
  function tick() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, "0");
    const mm = String(now.getMinutes()).padStart(2, "0");
    const ss = String(now.getSeconds()).padStart(2, "0");
    clockEl.firstChild.textContent = `${hh}:${mm}:${ss}`;
  }
  tick();
  setInterval(tick, 1000);

  // --- background particle field ---
  (function particles() {
    const canvas = document.createElement("canvas");
    document.getElementById("particles").appendChild(canvas);
    const ctx = canvas.getContext("2d");
    let w, h, dots;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    dots = Array.from({ length: 46 }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.4 + 0.3,
      vy: Math.random() * 0.12 + 0.03,
      o: Math.random() * 0.5 + 0.15,
    }));

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function frame() {
      ctx.clearRect(0, 0, w, h);
      const accent = getComputedStyle(body).getPropertyValue("--accent").trim() || "#45e8ff";
      ctx.fillStyle = accent;
      dots.forEach((d) => {
        ctx.globalAlpha = d.o;
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fill();
        if (!reduceMotion) {
          d.y -= d.vy;
          if (d.y < -4) { d.y = h + 4; d.x = Math.random() * w; }
        }
      });
      ctx.globalAlpha = 1;
      requestAnimationFrame(frame);
    }
    frame();
  })();

  // --- state machine, driven by Python (pywebview) or a local demo loop ---
  let controlled = false;
  let demoTimer = null;

  function applyState(estado, texto) {
    body.dataset.state = estado;
    if (texto) statusText.textContent = texto;
  }

  window.jarvisSetState = function (payload) {
    controlled = true;
    if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
    applyState(payload.estado, payload.texto);
  };

  function startDemo() {
    const estados = [
      ["aguardando", "[ AGUARDANDO COMANDO ]"],
      ["ouvindo", "[ CAPTURANDO ÁUDIO... ]"],
      ["processando", "[ SINCRONIZANDO REDE NEURAL... ]"],
      ["falando", "[ COMUNICANDO... ]"],
    ];
    let i = 0;
    applyState(...estados[0]);
    demoTimer = setInterval(() => {
      if (controlled) return;
      i = (i + 1) % estados.length;
      applyState(...estados[i]);
    }, 3200);
  }
  startDemo();
</script>
